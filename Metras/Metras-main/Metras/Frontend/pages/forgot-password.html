<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METRAS | Reset Password</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/forgot-password.js" defer></script>
</head>
<body class="login-body">
    <header class="topbar">
        <div class="brand"><a href="index.html" class="logo-link"><img src="../assets/logo.png" alt="METRAS Logo" class="logo-img"></a></div>
        <nav class="topnav"><a class="navlink" href="index.html">HOME</a><a class="navlink" href="login.html">LOGIN</a><a class="navlink" href="signup.html">SIGN UP</a></nav>
    </header>
    <main class="login-main">
        <div class="login-card">
            <div class="login-header"><h1>Reset Password</h1><p>Enter your account email to receive a password reset link.</p></div>
            <form id="resetForm" class="login-form">
                <div class="field"><label class="label" for="resetEmail">Email Address</label><input type="email" id="resetEmail" class="input" placeholder="name@company.com" autocomplete="email" required></div>
                <div id="resetError" class="error-message" role="alert" hidden></div>
                <div id="resetSuccess" role="status" hidden style="color:#8ee0ae;font-size:14px;"></div>
                <button type="submit" class="btn btn-primary btn-full" id="resetBtn">Send Reset Link</button>
            </form>
            <div class="login-footer"><p><a href="login.html" style="color:var(--primary-2);font-weight:800;">Back to Sign In</a></p></div>
        </div>
    </main>
    <footer class="footer"><div class="footer-container"><div class="footer-left"><div class="footer-logo">METRAS</div></div><div class="footer-links"><a href="index.html">Home</a><a href="login.html">Login</a><a href="signup.html">Sign Up</a></div><div class="footer-right"><p>© 2026 METRAS</p></div></div></footer>
</body>
</html>
