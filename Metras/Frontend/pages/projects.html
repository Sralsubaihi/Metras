<!DOCTYPE html>
<!-- Projects page: the user's projects; clicking one opens the project popup. Script: js/projects.js -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METRAS | Projects</title>

    <!-- Shared stylesheet for every page -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Page logic: js/projects.js -->
    <script type="module" src="../js/projects.js" defer></script>
</head>
<body>

    <!-- Top bar: logo, mobile menu button and main navigation -->
    <header class="topbar">
        <div class="brand">
            <button class="icon-btn" id="btnMenu" aria-label="Open menu">
                <span class="hamburger"></span>
            </button>
            <a href="projects.html" class="logo-link">
                <img src="../assets/logo.png" alt="METRAS Logo" class="logo-img">
            </a>
        </div>
        <nav class="topnav">
            <a class="navlink active" href="projects.html">PROJECTS</a>
            <a class="navlink" href="#" id="navTasks" style="display:none;">TASKS</a>
            <a class="navlink" href="chatbot.html">AI ASSISTANT</a>
        </nav>
    </header>

    <!-- Sub bar: page tabs / active project -->
    <section class="subbar">
        <div class="projects">
            <button class="pill pill-active">My Projects</button>
        </div>
    </section>

    <!-- Main content -->
    <main class="container">
        <div class="projects-header">
            <h1 class="title">My Projects</h1>
            <button class="btn btn-primary" id="btnCreateProject" type="button" style="display:none;">+ New Project</button>
        </div>

        <!-- Project cards (rendered by projects.js) -->
        <div class="projects-grid" id="projectsGrid">
            <div class="empty-state">Loading projects...</div>
        </div>
    </main>

    <!-- Mobile navigation drawer (opened by the menu button) and its backdrop -->
    <aside class="drawer" id="drawer">
        <div class="drawer-head">
            <div class="drawer-title">Menu</div>
            <button class="icon-btn" id="btnCloseDrawer">✕</button>
        </div>
        <div class="drawer-body">
            <a href="projects.html" class="drawer-link active">Projects</a>
            <a href="#" class="drawer-link" id="drawerTasks" style="display:none;">My Tasks</a>
            <a href="chatbot.html" class="drawer-link">AI Assistant</a>
            <a href="settings.html" class="drawer-link">Settings</a>
            <a href="login.html" class="drawer-link logout-link">Logout</a>
        </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">METRAS</div>
                <p class="footer-tagline">AI-powered requirements risk analysis platform</p>
            </div>
            <div class="footer-right">
                <p>Built by IT Students</p>
                <p>© 2026 METRAS</p>
            </div>
        </div>
    </footer>

</body>
</html>
