<!doctype html>
<!-- Settings page: view profile and change display name. Script: js/settings.js -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METRAS | Settings</title>

  <!-- Shared stylesheet for every page -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Page logic: js/settings.js -->
  <script type="module" src="../js/settings.js" defer></script>
</head>
<body>
  <!-- Top bar: logo, mobile menu button and main navigation -->
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="btnMenu" aria-label="Open menu"><span class="hamburger"></span></button>
      <a href="projects.html" class="logo-link"><img src="../assets/logo.png" alt="METRAS Logo" class="logo-img"></a>
    </div>
    <nav class="topnav">
      <a class="navlink" href="projects.html">PROJECTS</a>
      <a class="navlink" href="leader-tasks.html" id="settingsTasksLink">TASK BOARD</a>
      <a class="navlink" href="chatbot.html">AI ASSISTANT</a>
    </nav>
  </header>

  <!-- Sub bar: page tabs / active project -->
  <section class="subbar">
    <div class="projects"><button class="pill pill-active" type="button">Account Settings</button></div>
  </section>

  <!-- Main content -->
  <main class="container settings-page">

    <!-- Profile form -->
    <section class="card settings-card" aria-labelledby="settingsHeading">
      <div class="pane-head">
        <h1 class="title" id="settingsHeading">Settings</h1>
        <p class="subtitle">Review your account details and update your display name.</p>
      </div>

      <div class="settings-group">
        <h2 class="settings-title">Account Details</h2>
        <div class="setting-form">
      <div class="field">
        <label for="fullName">Full Name</label>
        <input class="setting-input" id="fullName" type="text" autocomplete="name" maxlength="100" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input class="setting-input readonly-input" id="email" type="email" disabled />
      </div>

      <div class="field">
        <label for="role">Role</label>
        <input class="setting-input readonly-input" id="role" type="text" disabled />
      </div>

      <div class="actions settings-actions">
        <button class="btn btn-primary" id="btnSaveSettings" type="button">Save Changes</button>
      </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Mobile navigation drawer (opened by the menu button) and its backdrop -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">Menu</div>
      <button class="icon-btn" id="btnCloseDrawer" aria-label="Close menu">✕</button>
    </div>
    <div class="drawer-body">
      <a href="projects.html" class="drawer-link">Projects</a>
      <a href="leader-tasks.html" class="drawer-link" id="settingsDrawerTasks">Task Board</a>
      <a href="chatbot.html" class="drawer-link">AI Assistant</a>
      <a href="settings.html" class="drawer-link active">Settings</a>
      <a href="login.html" class="drawer-link logout-link">Logout</a>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-left"><div class="footer-logo">METRAS</div><p class="footer-tagline">AI-powered requirements risk analysis platform</p></div>
      <div class="footer-right"><p>Built by IT Students</p><p>© 2026 METRAS</p></div>
    </div>
  </footer>
</body>
</html>
